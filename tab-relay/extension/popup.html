<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab Relay</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="mark" aria-hidden="true">⇄</div><div><h1>Tab Relay</h1><p>Let your chats talk to each other</p></div></header>
  <main>
    <label for="a">CHAT A</label><select id="a" aria-label="Chat A"></select>
    <div class="divider"><span></span><button id="swap" title="Swap the selected chats" aria-label="Swap the selected chats">⇅</button><span></span></div>
    <label for="b">CHAT B</label><select id="b" aria-label="Chat B"></select>
    <div class="automatic"><p><span id="readyIcon">✓</span><span id="detection">Latest replies detected automatically</span></p><p><span>✓</span>Text, images & files shared together</p></div>
    <button id="start" class="start"><span aria-hidden="true">▶︎</span> START SHARING</button>
    <button id="stop" class="stop"><span aria-hidden="true">■</span> STOP BOTH CHATS</button>
    <div class="status" aria-live="polite"><div id="dot" class="dot"></div><div><strong id="statusTitle">Choose your two chats</strong><p id="status">Starts with Chat A’s latest reply. No manual setup.</p></div></div>
    <p id="error" role="alert"></p>
  </main>
  <footer>♧ Only the two tabs you choose <span>v0.3.2 · Chrome may ask for site access</span></footer>
  <script src="popup.js" type="module"></script>
</body></html>
